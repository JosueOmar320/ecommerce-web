version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors blocked by peer dependencies; upgrade together, by hand, once supported:
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet (eslint and @eslint/js move together),
      # and openapi-typescript / typescript-eslint pin TypeScript to 5–6.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the Node.js major the app runs on (.nvmrc / CI); bump together with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
