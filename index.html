<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kestrel</title>
    <script>
      // Apply the saved (or system) colour scheme before first paint to avoid a light flash.
      (function () {
        try {
          var mode = localStorage.getItem('kestrel.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Kestrel: electronics, home and apparel, chosen with care." />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This store needs JavaScript enabled to work.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
